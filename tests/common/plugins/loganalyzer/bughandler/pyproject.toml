[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-bug-handler"
version = "1.0.0"
description = "Standalone bug handler for SONiC log analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "allure-pytest==2.8.18",
    "ansible==9.6.1",
    "gcsfs==2024.6.1",
    "jmespath==1.0.1",
    "natsort==8.4.0",
    "netmiko==3.2.0",
    "ntc_templates==6.0.0",
    "pandas==2.2.2",
    "perscache==0.6.1",
    "pexpect==4.9.0",
    "psutil==6.0.0",
    "pyarrow==16.1.0",
    "pyinstaller==6.6.0",
    "pytest-ansible==24.1.3",
    "requests-cache==1.2.1",
    "retry==0.9.2",
]

[project.scripts]
bug-handler = "bug_handler:main"

[tool.uv]
dev-dependencies = [
    "pyinstaller>=6.6.0",
]

[tool.pyinstaller]
# PyInstaller specific configuration can go here if needed
