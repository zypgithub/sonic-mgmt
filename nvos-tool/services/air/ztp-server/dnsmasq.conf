# Bind to container interface
interface=eth0
bind-interfaces

# DHCP pool (example 192.168.100.0/24)
dhcp-range=192.168.100.50,192.168.100.200,255.255.255.0,12h
dhcp-option=3,192.168.100.1     # default gateway
dhcp-option=6,8.8.8.8,1.1.1.1   # DNS

# PXE/boot file (uncomment if needed)
# dhcp-boot=pxelinux.0

# TFTP
enable-tftp
tftp-root=/var/lib/tftpboot

log-dhcp