[Service]
Environment="PYTHONMALLOC=malloc"
LogsDirectory=valgrind/{service_name}

# Valgrind can slow service startup/shutdown enough to hit unit timeouts (e.g. nginx-authenticator.service).
TimeoutStartSec=10min
TimeoutStopSec=10min

# Reset original ExecStart
ExecStart=

# Wrap original ExecStart with valgrind via bash
ExecStart=/bin/bash -lc " \
    export TS=$(date +%%Y%%m%%d_%%H%%M%%S.%%3N); \
    exec valgrind --tool=memcheck --leak-check=full \
        --log-file=${{LOGS_DIRECTORY}}/vg.{service_name}.$${{TS}}.%%p.%%n.out {service_command} \
"
